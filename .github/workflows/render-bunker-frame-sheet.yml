name: Render Zombie Bunker frame sheet
on:
  push:
    branches: [zombie-bunker-experiment]
    paths:
      - "src/videos/bunker/**"
      - "src/Root.tsx"
      - "package.json"
      - ".github/workflows/render-bunker-frame-sheet.yml"
  workflow_dispatch:
jobs:
  render-frame-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zombie-bunker-experiment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Install Remotion browser
        run: npx remotion browser ensure
      - name: Render actual Remotion frames
        run: |
          mkdir -p out/bunker
          node scripts/bridge-stills.mjs out/bunker/frame- 0,120,270,390,540,690,810,960,1100,1199 0.5 BunkerSurvival
      - name: Assemble contact sheet
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          files = sorted(Path("out/bunker").glob("frame-*.jpg"))
          if len(files) != 10:
              raise SystemExit(f"Expected 10 rendered frames, found {len(files)}: {files}")
          thumb_w, thumb_h, gap, margin = 324, 576, 18, 24
          sheet = Image.new("RGB", (margin*2 + thumb_w*5 + gap*4, margin*2 + thumb_h*2 + gap), "#111c2c")
          for i, path in enumerate(files):
              im = Image.open(path).convert("RGB")
              im = ImageOps.fit(im, (thumb_w, thumb_h))
              x = margin + (i % 5) * (thumb_w + gap)
              y = margin + (i // 5) * (thumb_h + gap)
              sheet.paste(im, (x, y))
          sheet.save("out/bunker/bunker-frame-sheet.jpg", quality=92)
          print(f"Contact sheet assembled from {len(files)} actual Remotion frames")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zombie-bunker-frame-sheet
          path: out/bunker/bunker-frame-sheet.jpg
          if-no-files-found: error
          retention-days: 7
